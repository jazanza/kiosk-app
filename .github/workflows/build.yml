name: Build iOS Kiosk App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild clean build -project KioskApp.xcodeproj -scheme KioskApp -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED="NO"

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/KioskApp.app Payload/
          zip -r KioskApp.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: KioskApp-IPA
          path: KioskApp.ipa
