name: KioskApp
options:
  bundleIdPrefix: com.chinchin
targets:
  KioskApp:
    type: application
    platform: iOS
    deploymentTarget: "9.0"
    settings:
      ARCHS: armv7
      VALID_ARCHS: armv7
      ONLY_ACTIVE_ARCH: NO
    sources: [KioskApp]
    info:
      path: KioskApp/Info.plist
      properties:
        NSCameraUsageDescription: "Requerido para tomar selfie"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIRequiresFullScreen: true
